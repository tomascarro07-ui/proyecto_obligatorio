<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mundo Periféricos - Menu</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"rel="stylesheet"integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"crossorigin="anonymous">
	<link rel="stylesheet" href="css/style.css">
</head>
	<body>
		<div class="mp-navbar">
			<div class="mp-navbar-container">
				<div class="mp-navbar-title">
					<p id="usuarioActual"></p>
				</div>
				<div>
					<form id="form-buscador" action="busqueda_catalogo.html">
						<div class="buscador">
							<input 
							minlength="2" 
							type="text" 
							name="nombre" 
							id="buscador" 
							placeholder="Buscar producto...">
							<button title="Buscar" type="submit"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-zoom"> <path stroke="none" d="M0 0h24v24H0z" fill="none" /> <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /> <path d="M21 21l-6 -6" /> </svg></button> 
						</div>
					</form>
				</div>
				<div class="acciones">
					<p id="sesion"></p>
					<div class="position-relative d-inline-block"> <a href="carrito.html" title="Carrito"> <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"> <path stroke="none" d="M0 0h24v24H0z" fill="none" /> <path d="M4 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /> <path d="M15 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /> <path d="M17 17h-11v-14h-2" /> <path d="M6 5l14 1l-1 7h-13" /> </svg> </a> <span id="cantidadCarrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-danger"> 0 </span> </div>
				</div>
			</div>
			<div>
				<p id="administrador"></p>
				<p id="usuario"></p>
			</div>
		</div>
		
		<br>

		<center><h2>¡Bienvenido a nuestra tienda de periféricos!</h2></center>

		
		<div>
			<div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
			  <div class="carousel-inner">
				<div class="carousel-item active">
				  <img src="img/carrousell_1.webp" class="d-block w-100" alt="...">
				</div>
				<div class="carousel-item">
					<a href="producto.html?id=2">
						<img title="Mouse Logitech G203 Lightsync" src="img/carrousell_2.webp" class="d-block w-100" alt="...">
					</a>
				</div>
				<div class="carousel-item">
					<a href="producto.html?id=9">
						<img title="¡Conseguí tu webcam!" src="img/carrousell_3.webp" class="d-block w-100" alt="...">
					</a>
				</div>
			  </div>
			  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
				<span class="carousel-control-prev-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Previous</span>
			  </button>
			  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
				<span class="carousel-control-next-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Next</span>
			  </button>
			</div>
		</div>
		
		<center><h2 id="catalogo">Catalogo de Productos:</h2></center>
		
		<div class="filtros">
			<div class="filtro-centro">
				<center>
					<label for="filtroTipo">Filtrar por:</label>
					<select id="filtroTipo" class="filter-btn" required>
						<option value="todas">Todos los productos</option>
					</select>
				</center>
			</div>

			<div id="cotizaciones" class="moneda">
				<label for="tipoConversion"></label>
					<select id="tipoConversion" class="filter-btn">
						<option value="">Peso Uruguayo</option>
						<option value="dolar">Dolar Americano</option>
						<option value="euro">Euro</option>
						<option value="peso-argentino">Peso Argentino</option>
					</select>
				</label>
			</div>
		</div>
		

		<p id="filtrarProductos"></p>

		<br>

		<div>
			<center><div id="catalogoProductos"></div></center>
		</div>

		<!-- Componentes Bootstrap -->

		<div class="toast-container position-fixed bottom-0 end-0 p-3">
			<div id="toastCarrito" class="toast toast-verde" role="alert" aria-live="assertive" aria-atomic="true">
				<div class="toast-header">
					<strong class="me-auto">🛒 Mundo Periféricos</strong>
					<small>Ahora</small>
					<button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Cerrar"></button>
				</div>
				<div class="toast-body" id="mensajeToast">
					¡Producto agregado al carrito!.
				</div>
			</div>
		</div>
		
		<footer class="py-3 my-4">
			<ul class="nav justify-content-center border-bottom pb-3 mb-3">
				<li class="nav-item">
				<a href="#" class="nav-link px-2 text-white">Inicio</a>
				</li>
				<li class="nav-item">
				<a href="#catalogo" class="nav-link px-2 text-white">Catálogo</a>
				</li>
				<li class="nav-item">
				<a href="guia_uso.html" class="nav-link px-2 text-white">Guia de Uso</a>
				</li>
				<li class="nav-item">
				<a href="https://github.com/tomascarro07-ui/proyecto_obligatorio/tree/master" target="_blank" class="nav-link px-2 text-white">GitHub</a>
				</li>
				<li class="nav-item">
				<a href="#" class="nav-link px-2 text-white">Sobre nosotros</a>
				</li>
			</ul>
			<p class="text-center text-white mb-0">&copy; 2026 Mundo Periféricos - Tomas & Dario</p>
		</footer>

		<script src="scripts/base/storage.js"></script>
		<script src="scripts/base/autenticacion.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
		<script type="module" src="scripts/base/initializer.js"></script>
		<script src="scripts/catalogo/index.js"></script>
		<script src="scripts/catalogo/listar_productos.js"></script>
		<script src="scripts/modelos/moneda.js"></script>
	</body>
