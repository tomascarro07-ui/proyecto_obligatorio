<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Periféricos - Editar producto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
	<body>
		<div class="main-container">
			<div class="container form-container">
				<h2>Editar producto</h2>
				<form id="form-editarProducto">
				
					<div class="form-group">
						<label for="nombreProducto">Nombre del producto</label>
						<input 
						type="text" 
						id="nombreProducto" 
						maxlength="60"
						placeholder="Nombre del producto"
						required>
					</div>
					
					<div>
							<label for="filtroTipo">Tipo de producto</label>
							<select id="filtroTipo" class="filter-btn" required>
								<option value="">Seleccione una opcion</option>
							</select>
					</div>

					<div class="form-group">
						<label for="cantidadProducto">Stock</label>
						<input 
						type="number" 
						id="cantidadProducto" 
						placeholder="Cantidad disponible" 
						required>
					</div>

					<div class="form-group">
						<label for="precioProducto">Precio</label>
						<input 
						type="number" 
						id="precioProducto" 
						placeholder="Precio" 
						required>
					</div>

					<div class="form-group">
						<label for="imgProducto">URL de la imagen</label>
						<input 
						type="text" 
						id="imgProducto" 
						placeholder="https://..." 
						required>
					</div>

					<div class="form-group">
						<label for="ivaProducto">IVA</label>
						<select id="ivaProducto" required>
							<option value="">Seleccione una opción</option>
							<option value="10">IVA mínimo (10%)</option>
							<option value="22">IVA básico (22%)</option>
							<option value="0">Exento de IVA</option>
						</select>
					</div>

					<div class="text-center margin-top">

						<button class="btn btn-primary" type="submit">
							Guardar cambios
						</button>

						<a href="admin.html" class="btn btn-secondary">
							Cancelar
						</a>

					</div>
				</form>
			</div>
		</div>
		<script src="scripts/base/storage.js"></script>
		<script src="scripts/base/autenticacion.js"></script>
		<script src="scripts/base/initializer.js"></script>
		<script src="scripts/admin/editar_producto_admin.js"></script>
	</body>
</html>
