<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mundo Periféricos - Menu</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"rel="stylesheet"integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"crossorigin="anonymous">
	<link rel="stylesheet" href="css/style.css">
</head>
	<body>
		<div class="mp-navbar">
			<div class="mp-navbar-container">
				<div class="mp-navbar-title">
					<p id="usuarioActual"></p>
				</div>
				<div>
					<form id="form-buscador" action="busqueda_catalogo.html">
						<div class="buscador">
							<input minlength="2" type="text" name="nombre" id="buscador" placeholder="Buscar producto...">
							<button title="Buscar" type="submit"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-zoom"> <path stroke="none" d="M0 0h24v24H0z" fill="none" /> <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /> <path d="M21 21l-6 -6" /> </svg></button> 
						</div>
					</form>
				</div>
				<div class="acciones">
					<button class="btn btn-small" onclick="cerrarSesion()">Cerrar sesión</button>
					<a href='carrito.html' title="Carrito"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-shopping-cart"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M4 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M15 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M17 17h-11v-14h-2" /><path d="M6 5l14 1l-1 7h-13" /></svg></a>
				</div>
			</div>
			<div>
				<p id="administrador"></p>
				<p id="usuario"></p>
			</div>
		</div>
		
		<br>

		<center><h2>¡Bienvenido a nuestra tienda de periféricos!</h2></center>

		
		<div>
			<div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
			  <div class="carousel-inner">
				<div class="carousel-item active">
				  <img src="img/carrousell_1.webp" class="d-block w-100" alt="...">
				</div>
				<div class="carousel-item">
					<a href="producto.html?nombre=Mouse%20Logitech%20G203%20Lightsync&stock=10&precio=1584.78&img=img/mouse-logitech-g203-lightsync.png&iva=22">
						<img title="Mouse Logitech G203 Lightsync" src="img/carrousell_2.webp" class="d-block w-100" alt="...">
					</a>
				</div>
				<div class="carousel-item">
					<a href="producto.html?nombre=Logitech%20C920&stock=9&precio=3048.78&img=img/logitech-c920.png&iva=22">
						<img title="¡Conseguí tu webcam!" src="img/carrousell_3.webp" class="d-block w-100" alt="...">
					</a>
				</div>
			  </div>
			  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
				<span class="carousel-control-prev-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Previous</span>
			  </button>
			  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
				<span class="carousel-control-next-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Next</span>
			  </button>
			</div>
		</div>

		<center><h2>Catalogo de Productos:</h2></center>
		<div>
			<center>
				<label for="filtroTipo">Filtrar por:</label>
				<select id="filtroTipo" class="filter-btn" required>
					<option value="todas">Todos los productos</option>
				</select>
			</center>
		</div>

		<p id="filtrarProductos"></p>

		<br>

		<div>
			<center><div id="catalogoProductos"></div></center>
		</div>

		<script src="scripts/base/storage.js"></script>
		<script src="scripts/base/autenticacion.js"></script>
		<script src="scripts/clases/producto.js"></script>
		<script src="scripts/base/initializer.js"></script>
		<script src="scripts/catalogo/menu.js"></script>
		<script src="scripts/catalogo/listar_productos.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"crossorigin="anonymous"></script>
	</body>
</html>
