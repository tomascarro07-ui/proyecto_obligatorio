<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mundo Periféricos - Producto</title>
	<link rel="stylesheet" href="css/style.css">
</head>
	<body>
		<div class="main-container">
			<div class="container">
				<h2>Detalles del producto</h2>

				<form id="form-producto">
					<div class="producto-detalle">
						<div class="producto-imagen">
							<img id="img" width="350">
						</div>

						<div class="producto-info">
							<h2 id="nombreProducto"></h2>

							<p id="precioProducto"></p>
							<p id="cantidadProducto"></p>

							<div class="form-group">
								<label for="agregarCantProducto">Cantidad</label>
								<input class="buscador" type="number" id="agregarCantProducto" name="agregarCantProducto" value="1" min="1">
							</div>
							<br>

							<button class="btn btn-primary" type="submit">Agregar al carrito</button>
							<div id="faltaStock"></div>
							<button class="btn btn-secondary" type="button" onclick="window.location.href='menu.html'">Volver al menú principal</button>
						</div>
					</div>
				</form>
			</div>
		</div>

		<script src="scripts/base/storage.js"></script>
		<script src="scripts/base/autenticacion.js"></script>
		<script src="scripts/catalogo/producto.js"></script>
	</body>
</html>
