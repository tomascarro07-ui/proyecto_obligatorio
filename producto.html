<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mundo Periféricos - Producto</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
	<link rel="stylesheet" href="css/style.css">
</head>
	<body>
		<div class="main-container">
			<div class="container">
				<h2>Detalles del producto</h2>
				<div class="container">
					<div class="menu">
						<label for="tipoConversion">Cotizacion:</label>
							<select id="tipoConversion" class="filter-btn">
								<option value="">Peso Uruguayo</option>
								<option value="dolar">Dolar Americano</option>
								<option value="euro">Euro</option>
								<option value="peso-argentino">Peso Argentino</option>
							</select>
						</label>
						<p>Conoce las cotizaciones</p>
					</div>
				</div>
				<form id="form-producto">
					<div class="producto-detalle">
						<div class="producto-imagen">
							<img id="img" width="350">
						</div>

						<div class="producto-info">
							<h2 id="nombreProducto"></h2>

							<p id="precioProducto"></p>
							<p id="cantidadProducto"></p>

							<div class="form-group">
								<label for="agregarCantProducto">Cantidad</label>
								<input 
								class="buscador" 
								type="number" 
								id="agregarCantProducto" 
								name="agregarCantProducto" 
								value="1" 
								min="1">
							</div>
							<br>
							<div id="enviarBtn">
								<button class="mp-btn mp-btn-primary" type="submit">Agregar al carrito</button>
							</div>
							<div id="faltaStock"></div>
							<button class="mp-btn mp-btn-secondary" type="button" onclick="window.location.href='index.html'">Volver al menú principal</button>
						</div>
					</div>
				</form>
			</div>
		</div>
		<script src="scripts/base/storage.js"></script>
		<script src="scripts/base/autenticacion.js"></script>
		<script src="scripts/modelos/moneda.js"></script>
		<script src="scripts/catalogo/producto.js"></script>
		<script type="module" src="scripts/gestores/gestorCarrito.js"></script>
		<script type="module" src="./scripts/formCarrito.js"></script>
	</body>
</html>
