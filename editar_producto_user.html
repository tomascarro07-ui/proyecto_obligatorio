<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Periféricos - Editar Producto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
	<body>

		<div class="main-container">

			<div class="container form-container">

				<h2>Editar producto</h2>

				<form id="form-editarProducto">

					<div class="text-center">
						<img id="imgProducto" width="250">
					</div>

					<h3 id="nombreProducto"></h3>

					<p id="precioProducto"></p>

					<div class="form-group">
						<label for="cantidadProducto">Unidades en su carrito</label>
						<input
							type="number"
							id="cantidadProducto"
							min="1"
							placeholder="Cantidad"
							required>
					</div>

					<div class="text-center margin-top">

						<button class="btn btn-primary" type="submit">
							Guardar cambios
						</button>

						<a href="carrito.html" class="btn btn-secondary">
							Volver al carrito
						</a>

					</div>
				</form>

			</div>

		</div>

		<script src="scripts/base/storage.js"></script>
		<script src="scripts/base/autenticacion.js"></script>
		<script src="scripts/base/initializer.js"></script>
		<script src="scripts/carrito/editar_producto_user.js"></script>
	</body>
</html>
