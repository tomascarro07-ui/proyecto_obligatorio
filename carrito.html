<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mundo Periféricos - Carrito</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="css/style.css">
</head>
	<body>
		<div class="main-container">
			<div class="container">
				<h2>Mi carrito</h2>
				<p id="micarrito"></p>
				<p id="totalCompra"></p>
				<p id="continuarCompra"></p>

				<div>
					<a class="mp-btn mp-btn-small" href="index.html">
						Volver al menú principal
					</a>
				</div>
			</div>
		</div>
		<div class="modal" tabindex="-1" id="modalEliminarProducto">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">Eliminar producto</h5>
						<button type="button" class="mp-btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
						<div class="modal-body">
						<p>¿Deseas eliminar este producto?</p>
					</div>
					<div class="modal-footer">
						<button type="button" class="mp-btn mp-btn-secondary" data-bs-dismiss="modal">Cancelar</button>
						<button type="button" class="mp-btn mp-btn-primary" id="btnConfirmarEliminar">Eliminar</button>
					</div>
				</div>
			</div>
		</div>

		<script src="scripts/base/storage.js"></script>
		<script src="scripts/base/autenticacion.js"></script>
		<script type="module" src="scripts/pages/mainCarritos.js"></script>
		<script type="module" src="scripts/formCarrito.js"></script>
		<script src="scripts/carrito/carrito.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	</body>
</html>
