<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mundo Periféricos - Administradores</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="css/style.css">
</head>
	<body>
		<div class="main-container">
			<div class="container">
				<h2>¡Registrar productos!</h2>

				<div>
					<form id="form-productos">
						<div class="form-group">
							<label for="nombreProducto">Nombre de producto *</label>
							<input 
							type="text" 
							id="nombreProducto" 
							maxlength="60" 
							placeholder="Nombre producto" 
							required>
						</div>
						
						<!-- Quiero hacer que el id sea autoincrementable -->
						
						<div class="form-group">
							<label for="idProducto">ID del producto</label>
							<input 
							type="number" 
							id="idProducto"
							readonly>
						</div>
						
						<div>
							<label for="filtroTipo">Tipo de producto *</label>
							<select id="filtroTipo" class="filter-btn" required>
								<option value="">Seleccione una opcion</option>
							</select>
							<button class="mp-btn mp-btn-small" onclick="window.location.href='editar_filtros_admin.html'">Editar Filtros</button>
						</div>
						
						<br><br>

						<div class="form-group">
							<label for="cantidadProducto">Stock de producto *</label>
							<input 
							type="number" 
							id="cantidadProducto" 
							placeholder="Cantidad de producto" 
							min="1"
							value="1"
							required>
						</div>

						<div class="form-group">
							<label for="precioProducto">Precio del producto *</label>
							<input 
							type="number" 
							id="precioProducto" 
							placeholder="Precio de producto"
							min="1"							
							required>
						</div>

						<div class="form-group">
							<label for="ivaProducto">IVA de producto: *</label>
							<select id="ivaProducto" required>
								<option value="">Seleccione una opcion</option>
								<option value="10">IVA Minimo</option>
								<option value="22">IVA Básico</option>
								<option value="0">Extento de IVA</option>
							</select>
						</div>

						<div class="form-group">
							<label for="imgProducto">Imagen del producto</label>
							<input 
							type="text" 
							id="imgProducto" 
							placeholder="img/laptop.png">
						</div>

						<div class="text-center">
							<button type="submit" class="mp-btn mp-btn-primary">Registrar producto</button>
						</div>
					</form>

					<p id="catalogoProductos"></p>
					
					<br><br>

					<div class="text-center">
						<a href="index.html" class="mp-btn mp-btn-secondary">Ver menú principal</a>
					</div>
				</div>
				<div class="modal" tabindex="-1" id="modalEliminarProducto">
				  <div class="modal-dialog">
					<div class="modal-content">
					  <div class="modal-header">
						<h5 class="modal-title">Eliminar producto</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					  </div>
					  <div class="modal-body">
						<p>¿Deseas eliminar este producto?</p>
					  </div>
					  <div class="modal-footer">
						<button type="button" class="mp-btn mp-btn-secondary" data-bs-dismiss="modal">Cancelar</button>
						<button type="button" class="mp-btn mp-btn-primary" id="btnConfirmarEliminar">Eliminar</button>
					  </div>
					</div>
				  </div>
				</div>
			</div>
		</div>

		<script src="scripts/base/storage.js"></script>
		<script src="scripts/base/autenticacion.js"></script>
		<script type="module" src="scripts/base/initializer.js"></script>
		<script type="module" src="scripts/pages/main.js"></script>
		<script type="module" src="scripts/mainProductos.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	</body>
</html>
