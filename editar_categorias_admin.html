<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mundo Periféricos - Editar filtros</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="css/style.css">
</head>
	<body>
		<div class="main-container">
			<div class="container">
				<form id="form-categoria">
					<div class="form-group">
						<label for="nombreCategoria">Nombre de la categoria:</label>
						<input type="text" id="nombreCategoria">
					</div>
					<p id="mostrarFiltro"></p>
					<button class="mp-btn mp-btn-primary" type="submit">Guardar categoria</button>
				</form>
				<button class="mp-btn mp-btn-secondary" onclick="window.location.href='admin.html'">Volver</button>
			</div>
		</div>

		<!-- Componentes Bootstrap -->

		<div class="modal" tabindex="-1" id="modalEliminarProducto">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">Eliminar Categoria</h5>
						<button type="button" class="mp-btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<p>¿Deseas eliminar esta categoria?</p>
					</div>
					<div class="modal-footer">
						<button type="button" class="mp-btn mp-btn-secondary" data-bs-dismiss="modal">Cancelar</button>
						<button type="button" class="mp-btn mp-btn-primary" id="btnConfirmarEliminar">Eliminar</button>
					</div>
				</div>
			</div>
		</div>
		
		<div class="toast-container position-fixed bottom-0 end-0 p-3">
			<div id="toastCategoria" class="toast toast-verde" role="alert" aria-live="assertive" aria-atomic="true">
				<div class="toast-header">
					<strong class="me-auto">🛒 Mundo Periféricos</strong>
					<small>Ahora</small>
					<button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Cerrar"></button>
				</div>
				<div class="toast-body" id="mensajeToast"> 
					Categoria registrada satisfactoriamente.
				</div>
			</div>
		</div>

		<script src="scripts/base/storage.js"></script>
		<script src="scripts/base/autenticacion.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
		<script type="module" src="scripts/base/initializer.js"></script>
		<script type="module" src="scripts/formFiltros.js"></script>
		<script type="module" src="scripts/pages/mainFiltros.js"></script>
	</body>
</html>
